name: Tests

# Les tests sont ceux de l'intégration Onkyo du cœur (2026.11.1), adaptés à
# onkyo_alt.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: HA 2026.11.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install
        run: |
          uv venv
          uv pip install "homeassistant==2026.11.1" "pytest-homeassistant==2026.11.1" \
            $(jq -r '.requirements[]' custom_components/onkyo_alt/manifest.json)
      - name: Pytest
        run: uv run --no-project python -m pytest -q
